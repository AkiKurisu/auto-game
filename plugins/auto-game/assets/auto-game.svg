<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Auto Game plugin icon</title>
  <desc id="desc">The DotCraft robot in its working pose, holding a game controller, on a dark rounded background.</desc>
  <defs>
    <linearGradient id="robot-blue" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2458f7"/>
      <stop offset=".46" stop-color="#5f82f7"/>
      <stop offset="1" stop-color="#8fa5ff"/>
    </linearGradient>
    <linearGradient id="robot-mark" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2257f5"/>
      <stop offset=".55" stop-color="#577df7"/>
      <stop offset="1" stop-color="#8ca2ff"/>
    </linearGradient>
    <linearGradient id="robot-yellow" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf11"/>
      <stop offset="1" stop-color="#f6b500"/>
    </linearGradient>
    <filter id="robot-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft-lift" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1220" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#141C2E"/>

  <g transform="translate(512 512) scale(.88) translate(-512 -512)">
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#robot-shadow)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="163" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="725" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>

      <g filter="url(#soft-lift)">
        <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#robot-blue)"/>
        <rect x="206" y="514" width="90" height="171" rx="19" fill="url(#robot-blue)"/>
        <rect x="728" y="514" width="90" height="171" rx="19" fill="url(#robot-blue)"/>
        <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#robot-blue)"/>
      </g>

      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#robot-yellow)"/>

      <rect x="381" y="581" width="45" height="87" rx="16" fill="url(#robot-mark)"/>
      <rect x="598" y="581" width="45" height="87" rx="16" fill="url(#robot-mark)"/>
      <path d="M487 700h50" stroke="url(#robot-yellow)" stroke-width="22" stroke-linecap="round"/>

      <g transform="translate(512 772) rotate(-2.5) scale(.94)" filter="url(#robot-shadow)">
        <path d="M-96-78H96C132-78 160-52 166-16L186 74C194 116 164 150 124 150C100 150 78 136 68 114L52 78H-52L-68 114C-78 136-100 150-124 150C-164 150-194 116-186 74L-166-16C-160-52-132-78-96-78Z" fill="#1d2433" stroke="#fff" stroke-width="21" stroke-linejoin="round"/>
        <rect x="-128" y="-11" width="104" height="34" rx="13" fill="#fff"/>
        <rect x="-93" y="-46" width="34" height="104" rx="13" fill="#fff"/>
        <circle cx="60" cy="-16" r="24" fill="#7557FF"/>
        <circle cx="108" cy="26" r="24" fill="#FFCF11"/>
      </g>
    </g>
  </g>
</svg>
